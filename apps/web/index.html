<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pinpoint — Daily Geography Game</title>
    <meta
      name="description"
      content="Pinpoint: a daily general-knowledge & geography game. Read a clue, tap the country on the map. New puzzle every day."
    />
    <meta name="theme-color" content="#0b1e33" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%8D%3C/text%3E%3C/svg%3E"
    />

    <!-- Open Graph (WhatsApp, Facebook, iMessage, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Pinpoint — Daily Geography Game" />
    <meta
      property="og:description"
      content="Read a clue, tap the country on the map. A new general-knowledge & geography puzzle every day."
    />
    <meta property="og:url" content="https://chiragmadaan.github.io/pinpoint/" />
    <meta property="og:site_name" content="Pinpoint" />
    <!--
      Share card. MUST be an absolute URL — scrapers do not resolve relative paths.
      Regenerate with `pnpm og`. Scrapers cache previews for days/weeks, so if the design changes,
      change the FILENAME here too (og-2.png, ...) or existing shares keep the old image.
    -->
    <meta property="og:image" content="https://chiragmadaan.github.io/pinpoint/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Pinpoint — a world map with the tagline: read a clue, find the country."
    />

    <!-- Twitter: summary_large_image (not "summary") is what renders the full-width card. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Pinpoint — Daily Geography Game" />
    <meta
      name="twitter:description"
      content="Read a clue, tap the country on the map. A new puzzle every day."
    />
    <meta name="twitter:image" content="https://chiragmadaan.github.io/pinpoint/og.png" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
